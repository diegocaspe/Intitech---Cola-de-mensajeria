# Solo en el servidor (docker-compose.prod.yml lo monta en /etc/rabbitmq/conf.d/). En la laptop no se usa.
# El panel web y su API viven bajo /rabbitmq/ para que Caddy los sirva en https://<dominio>/rabbitmq/ sin
# reescribir rutas. Por el túnel SSH también: http://localhost:15672/rabbitmq/
management.path_prefix = /rabbitmq
