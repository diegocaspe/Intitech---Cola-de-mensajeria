tags:
- name: Usuarios
  description: Registro, inicio y cierre de sesión, verificación del correo y recuperación de contraseña.
- name: Tienda
  description: 'Lo que usa la tienda del cliente: catálogo, compra y seguimiento del pedido.'
- name: Zona Yape real
  description: 'Productos que se pagan con Yape de verdad: checkout con monto único, pantalla de pago en vivo y el webhook
    que recibe las notificaciones de Yape desde MacroDroid.'
- name: Yape (admin)
  description: 'Pagos Yape en vivo: pedidos esperando pago, notificaciones, asignación manual y simulación.'
- name: Pedidos (admin)
  description: Consulta y gestión directa de pedidos.
- name: Panel (admin)
  description: Métricas, pedidos fallidos (DLQ), reconciliación y reinicio de la demo.
- name: Simulador (admin)
  description: 'Genera tráfico de prueba: goteo, ráfagas o un Black Friday completo.'
- name: Sabotajes (admin)
  description: Apaga o recupera contenedores reales para demostrar la tolerancia a fallos.
