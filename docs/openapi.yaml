# Contrato de la API (OpenAPI 3) de la tienda Inti Tech.
# Generado automáticamente por FastAPI desde app/routes/api.py.
# Versión interactiva con el sistema encendido: http://localhost:8000/docs

openapi: 3.1.0
info:
  title: Tienda Inti Tech - Black Friday
  description: 'API de la tienda: el cliente compra, el pedido se guarda en PostgreSQL y se encola en RabbitMQ, y un worker
    lo procesa. Las rutas marcadas (admin) requieren iniciar sesión como administrador.'
  version: '3.0'
paths:
  /api/auth/register:
    post:
      tags:
      - Usuarios
      summary: Registrar un cliente
      description: Crea la cuenta y deja la sesión iniciada (cookie).
      operationId: register_api_auth_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterIn'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/auth/login:
    post:
      tags:
      - Usuarios
      summary: Iniciar sesión
      description: 'Valida correo y contraseña y entrega la cookie de sesión. Contra la fuerza bruta: tras 5 intentos fallidos
        en 60 s desde una misma IP responde 429 (con la cabecera Retry-After) hasta que pase la ventana.'
      operationId: login_api_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '429':
          description: Demasiados intentos fallidos desde esta IP
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/auth/logout:
    post:
      tags:
      - Usuarios
      summary: Cerrar sesión
      operationId: logout_api_auth_logout_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/auth/me:
    get:
      tags:
      - Usuarios
      summary: Usuario actual
      description: 'Datos del usuario con sesión iniciada, o null si no hay sesión. email_status: pending (falta verificar
        el correo), verified, legacy (cuenta de prueba anterior a los correos) o null si la base de datos no responde.'
      operationId: me_api_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/auth/verify:
    get:
      tags:
      - Usuarios
      summary: Verificar el correo
      description: Destino del enlace del correo de bienvenida. El token es de un solo uso y vence a las 24 h. Redirige a
        la tienda con ?verificado=ok, expirado, usado o invalido.
      operationId: verify_email_api_auth_verify_get
      parameters:
      - name: token
        in: query
        required: false
        schema:
          type: string
          default: ''
          title: Token
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/auth/verify/resend:
    post:
      tags:
      - Usuarios
      summary: Reenviar el correo de verificación
      description: Genera un enlace nuevo para la cuenta con sesión iniciada (como mucho uno por minuto).
      operationId: resend_verification_api_auth_verify_resend_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/auth/forgot:
    post:
      tags:
      - Usuarios
      summary: Olvidé mi contraseña
      description: Si el correo pertenece a un cliente, le envía un enlace para crear una contraseña nueva (vence en 60 min,
        un solo uso). Responde lo mismo exista o no la cuenta.
      operationId: forgot_password_api_auth_forgot_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/auth/reset:
    post:
      tags:
      - Usuarios
      summary: Restablecer la contraseña
      description: Cambia la contraseña con el token del enlace recibido por correo. El token se gasta al usarlo.
      operationId: reset_password_api_auth_reset_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/products:
    get:
      tags:
      - Tienda
      summary: Catálogo de productos
      description: Los productos con precio, descuento, stock e imagen. El stock sale de la tabla products (el worker lo
        descuenta al confirmar cada pedido). Los de la Zona Yape real llevan pago_yape_real=true y su stock descuenta además
        los pedidos pendientes de pago (solo si la zona está activa).
      operationId: list_products_api_products_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/checkout:
    post:
      tags:
      - Tienda
      summary: Comprar (checkout)
      description: 'Convierte el carrito en un pedido. Solo se envían SKU y cantidad: los precios salen del catálogo del servidor.
        Requiere sesión.'
      operationId: checkout_api_checkout_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutIn'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/orders/{order_id}/track:
    get:
      tags:
      - Tienda
      summary: Seguir un pedido
      description: Estado del pedido y su posición en la cola. El cliente lo consulta cada segundo.
      operationId: track_api_orders__order_id__track_get
      parameters:
      - name: order_id
        in: path
        required: true
        schema:
          type: string
          title: Order Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/my/orders:
    get:
      tags:
      - Tienda
      summary: Mis pedidos
      description: Últimos pedidos del cliente con sesión iniciada.
      operationId: my_orders_api_my_orders_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/store/live:
    get:
      tags:
      - Tienda
      summary: Estado en vivo de la tienda
      description: Pedidos del último minuto, mensajes en cola y si RabbitMQ y PostgreSQL están arriba.
      operationId: store_live_api_store_live_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/store-url:
    get:
      tags:
      - Tienda
      summary: Dirección pública de la tienda
      description: URL que el público abre desde el celular (la del código QR).
      operationId: store_url_api_store_url_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/yape/config:
    get:
      tags:
      - Zona Yape real
      summary: Configuración pública de la Zona Yape
      description: Si la zona está activa, el titular de la cuenta Yape, el rango de montos, los minutos para pagar y si el
        QR está configurado (static/img/yape_qr.png). Nunca incluye el secreto.
      operationId: yape_config_api_yape_config_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/yape/checkout:
    post:
      tags:
      - Zona Yape real
      summary: Iniciar un pago con Yape real
      description: Crea un pedido pendiente_pago_yape de 1 unidad del producto con un MONTO ÚNICO entre YAPE_MONTO_MIN y YAPE_MONTO_MAX
        que ningún otro pedido vigente usa, y reserva el stock por YAPE_MINUTOS_EXPIRA minutos. Requiere sesión. Si la base
        de datos no responde o no quedan montos libres responde 503 (alta demanda) y no crea nada.
      operationId: yape_checkout_api_yape_checkout_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/YapeCheckoutIn'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '409':
          description: Sin stock
        '503':
          description: 'Alta demanda: reintenta en unos segundos'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/yape/pedidos/{pedido_id}:
    get:
      tags:
      - Zona Yape real
      summary: Pantalla de pago en vivo
      description: 'Estado del pago para el cliente; la tienda lo consulta cada segundo. fase: esperando_yapeo, en_cola (con
        posicion), procesando, pago_registrado (RabbitMQ caído tras recibir el pago), confirmado, expirado o sin_stock (el
        pago llegó tarde y otro cliente se llevó la última unidad: se devuelve).'
      operationId: yape_estado_api_yape_pedidos__pedido_id__get
      parameters:
      - name: pedido_id
        in: path
        required: true
        schema:
          type: string
          title: Pedido Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/pagos/yape/notificacion:
    post:
      tags:
      - Zona Yape real
      summary: Webhook de MacroDroid (notificación de Yape)
      description: 'Recibe cada notificación de Yape que reenvía MacroDroid. Exige la cabecera X-Yape-Secret igual a YAPE_WEBHOOK_SECRET
        (401 si no coincide) y como mucho 60 peticiones por minuto (429). Guarda SIEMPRE el texto crudo y, en la misma transacción,
        el evento pago.yape_recibido en el outbox; responde 200 solo si se guardó y 503 si la base de datos no responde (MacroDroid
        debe reintentar). La misma notificación (título + texto) en el mismo minuto se guarda una sola vez (200 con duplicada=true).
        No procesa el pago: lo hace el worker desde la cola pagos.'
      operationId: yape_webhook_api_pagos_yape_notificacion_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '401':
          description: Falta X-Yape-Secret o no coincide
        '429':
          description: Más de 60 por minuto
        '503':
          description: 'Base de datos no disponible o zona desactivada: reintentar'
      parameters:
      - name: X-Yape-Secret
        in: header
        required: true
        schema:
          type: string
        description: Igual a YAPE_WEBHOOK_SECRET
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              required:
              - texto
              properties:
                titulo:
                  type: string
                  maxLength: 500
                  example: Confirmación de Pago
                texto:
                  type: string
                  maxLength: 4000
                  example: Yape! JUAN PEREZ te envió un pago por S/ 1.37
  /api/yape/admin/panel:
    get:
      tags:
      - Yape (admin)
      summary: Pagos Yape en vivo
      description: Pedidos esperando pago (monto y tiempo restante), notificaciones con su texto crudo, estado y etapa (notificacion
        → outbox → cola_pagos → worker → confirmado) y los contadores de las colas pagos y pagos.dlq.
      operationId: yape_panel_api_yape_admin_panel_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/yape/admin/notificaciones/{notificacion_id}/asignar:
    post:
      tags:
      - Yape (admin)
      summary: Asignar a un pedido
      description: Asocia a mano una notificación sin_coincidencia (o ignorada) a un pedido Yape pendiente o expirado. El
        pedido queda pagado y sigue el flujo normal.
      operationId: yape_asignar_api_yape_admin_notificaciones__notificacion_id__asignar_post
      parameters:
      - name: notificacion_id
        in: path
        required: true
        schema:
          type: integer
          title: Notificacion Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AsignarIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/yape/admin/notificaciones/{notificacion_id}/rechazar:
    post:
      tags:
      - Yape (admin)
      summary: Rechazar una notificación
      description: Marca como rechazada una notificación sin_coincidencia o ignorada (queda guardada, con su texto).
      operationId: yape_rechazar_api_yape_admin_notificaciones__notificacion_id__rechazar_post
      parameters:
      - name: notificacion_id
        in: path
        required: true
        schema:
          type: integer
          title: Notificacion Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/yape/admin/simular:
    post:
      tags:
      - Yape (admin)
      summary: Simular una notificación de Yape
      description: 'Para probar sin dinero real: crea una notificación marcada como simulada con el monto del pedido indicado
        (o el monto dado) y la manda por el mismo camino que una real (outbox → cola pagos → worker).'
      operationId: yape_simular_api_yape_admin_simular_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimularIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /orders:
    post:
      tags:
      - Pedidos (admin)
      summary: Crear un pedido directo
      description: Crea un pedido indicando los productos y precios a mano, sin pasar por el carrito.
      operationId: create_order_orders_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderIn'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Pedidos (admin)
      summary: Listar pedidos
      description: 'Filtra opcionalmente por estado: PENDING, PUBLISHED, PROCESSED, FAILED o REJECTED (rechazado por negocio: sin stock o pago rechazado).'
      operationId: list_orders_orders_get
      parameters:
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/OrderStatus'
          - type: 'null'
          title: Status
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 100
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /orders/{order_id}:
    get:
      tags:
      - Pedidos (admin)
      summary: Ver un pedido
      operationId: get_order_orders__order_id__get
      parameters:
      - name: order_id
        in: path
        required: true
        schema:
          type: string
          title: Order Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /orders/republish-pending:
    post:
      tags:
      - Pedidos (admin)
      summary: Reenviar pendientes del outbox
      description: 'Herramienta de administración: publica ya los pedidos pendientes sin esperar al relay.'
      operationId: republish_pending_orders_republish_pending_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/metrics:
    get:
      tags:
      - Panel (admin)
      summary: Métricas del panel
      description: 'Todo lo que el panel muestra: pedidos por estado, colas, outbox, DLQ, servicios y simulador.'
      operationId: metrics_api_metrics_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/dlq:
    get:
      tags:
      - Panel (admin)
      summary: Ver una DLQ
      description: 'Mensajes que agotaron sus 3 reintentos, con el error y la hora. queue=pedidos (por defecto), queue=correos
        (correos que no se pudieron enviar: tipo y destinatario, sin el contenido) o queue=pagos (notificaciones de Yape,
        por notificacion_id).'
      operationId: dlq_list_api_dlq_get
      parameters:
      - name: queue
        in: query
        required: false
        schema:
          enum:
          - pedidos
          - correos
          - pagos
          type: string
          default: pedidos
          title: Queue
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/dlq/reprocess:
    post:
      tags:
      - Panel (admin)
      summary: Reprocesar desde la DLQ
      description: 'Devuelve a la cola principal los mensajes elegidos (o todos). queue=correos reenvía correos a la cola
        del mailer: los que ya salieron no se repiten (idempotencia por email_id).'
      operationId: dlq_reprocess_api_dlq_reprocess_post
      parameters:
      - name: queue
        in: query
        required: false
        schema:
          enum:
          - pedidos
          - correos
          - pagos
          type: string
          default: pedidos
          title: Queue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DlqAction'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/dlq/discard:
    post:
      tags:
      - Panel (admin)
      summary: Descartar de la DLQ
      description: Elimina de la DLQ los mensajes elegidos (o todos). queue=pedidos (por defecto) o queue=correos.
      operationId: dlq_discard_api_dlq_discard_post
      parameters:
      - name: queue
        in: query
        required: false
        schema:
          enum:
          - pedidos
          - correos
          - pagos
          type: string
          default: pedidos
          title: Queue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DlqAction'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/lab/run:
    post:
      tags:
      - Panel (admin)
      summary: Experimento de persistencia
      description: Compara una cola en disco contra una en memoria reiniciando RabbitMQ.
      operationId: lab_run_api_lab_run_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/reconcile:
    post:
      tags:
      - Panel (admin)
      summary: Reconciliar desde la BD
      description: Reenvía los pedidos publicados que nunca se procesaron (mensajes perdidos en el broker).
      operationId: reconcile_api_reconcile_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/sim/start:
    post:
      tags:
      - Simulador (admin)
      summary: Iniciar simulación
      description: Modo manual (ritmo constante) o modo día (Black Friday con pico a medianoche).
      operationId: sim_start_api_sim_start_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimStart'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/sim/stop:
    post:
      tags:
      - Simulador (admin)
      summary: Detener simulación
      operationId: sim_stop_api_sim_stop_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/sim/rate:
    post:
      tags:
      - Simulador (admin)
      summary: Cambiar el ritmo
      description: Pedidos por segundo de la simulación en curso.
      operationId: sim_rate_api_sim_rate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RateIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/sim/burst:
    post:
      tags:
      - Simulador (admin)
      summary: Enviar una ráfaga
      description: Envía de golpe la cantidad de pedidos indicada (los botones 1 pedido y 5 pedidos). Con count=1 el pedido
        se crea al instante y la respuesta incluye su order_id.
      operationId: sim_burst_api_sim_burst_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BurstIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/stock:
    get:
      tags:
      - Panel (admin)
      summary: Stock por producto
      description: Stock actual de cada producto (tabla products) junto al stock inicial de catalogo.json y, en la Zona Yape,
        las unidades reservadas por pedidos pendientes de pago.
      operationId: stock_list_api_stock_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/stock/reset:
    post:
      tags:
      - Panel (admin)
      summary: Restablecer stock
      description: Vuelve a poner el stock de todos los productos según catalogo.json (para reiniciar la demo antes de la
        exposición). No toca pedidos ni colas.
      operationId: stock_reset_api_stock_reset_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/reset:
    post:
      tags:
      - Panel (admin)
      summary: Reiniciar la demo
      description: Vacía la base de datos (incluidos los pedidos Yape y sus notificaciones) y todas las colas (pedidos, correos
        y pagos), restablece el stock según catalogo.json y la configuración.
      operationId: reset_api_reset_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/chaos/{action}:
    post:
      tags:
      - Sabotajes (admin)
      summary: Sabotear o recuperar
      description: 'Valores de action. Caídas: kill-worker, kill-relay, kill-mailer, crash-broker, crash-db. Recuperar: revive-worker,
        revive-relay, revive-mailer, revive-broker, revive-db, recover (todo). Worker lento: slow-on / slow-off. Pedidos
        venenosos: poison-on / poison-off. Persistencia: persist-on / persist-off. Escalar: workers-up / workers-down.'
      operationId: chaos_api_chaos__action__post
      parameters:
      - name: action
        in: path
        required: true
        schema:
          type: string
          title: Action
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
